name: CI — Testes Xadrez-ES2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — Engine e IA (C11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Compilar Backend (engine + IA)
        run: make backend

      - name: Rodar testes da Engine (PERFT_MAX_DEPTH=3)
        env:
          PERFT_MAX_DEPTH: 3
        run: make test-engine

      - name: Rodar testes da IA (unidade, integração e sistema)
        run: make test-ia

  protocol-tests:
    name: Backend — Protocolo UCI (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Compilar Backend (engine + IA)
        run: make backend

      - name: Rodar suíte de protocolo UCI
        run: make test-protocol

  interface-tests:
    name: Interface — SFML 2 (C++17)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar SFML 2 e Xvfb (display virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev xvfb

      - name: Compilar Backend e Interface
        run: make

      - name: Rodar testes da Interface (smoke, unidade, integração e sistema)
        run: xvfb-run -a make test-interface

  backend-tests-windows:
    name: Backend — Engine e IA (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar MinGW (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Adicionar UCRT64 ao PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"

      - name: Compilar Backend (engine + IA)
        run: mingw32-make -C Backend

      - name: Rodar testes da Engine (PERFT_MAX_DEPTH=3)
        env:
          PERFT_MAX_DEPTH: 3
        run: mingw32-make -C Backend test-engine

      - name: Rodar testes da IA (unidade, integração e sistema)
        run: mingw32-make -C Backend test-ia

  protocol-tests-windows:
    name: Backend — Protocolo UCI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar MinGW (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Adicionar UCRT64 ao PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"

      - name: Compilar Backend (engine + IA)
        run: mingw32-make -C Backend

      - name: Rodar suíte de protocolo UCI
        run: python Backend/engine/test/protocol/run.py Backend/build/main.exe

  interface-tests-windows:
    name: Interface — SFML 2 (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar MinGW e CMake (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake

      - name: Adicionar UCRT64 ao PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"

      - name: Cache da SFML 2 (FetchContent)
        uses: actions/cache@v4
        with:
          path: interface/build/_deps
          key: win-ucrt64-sfml-2.6.2-${{ hashFiles('interface/CMakeLists.txt') }}

      - name: Compilar Backend (engine + IA)
        run: mingw32-make -C Backend

      - name: Configurar e compilar Interface e testes via CMake
        run: |
          cmake -S interface -B interface/build -G "MinGW Makefiles" -DBUILD_TESTING=ON
          cmake --build interface/build --parallel

      - name: Rodar testes da Interface (smoke, unidade, integração e sistema)
        working-directory: interface
        shell: pwsh
        run: |
          .\build\smoke_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\unit_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\integration_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\system_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências dos testes de aceitação
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r acceptance-tests/requirements.txt

      - name: Executar testes de aceitação desktop
        run: python acceptance-tests/run_tests.py
        continue-on-error: true

      - name: Validar resultado dos testes de aceitação
        if: always()
        shell: pwsh
        run: |
          $reportDir = Get-ChildItem "acceptance-tests/reports" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $reportDir) {
            throw "Nenhum relatório de execução foi encontrado."
          }

          $junitPath = Join-Path $reportDir.FullName "junit.xml"

          if (-not (Test-Path $junitPath)) {
            throw "Relatório JUnit não encontrado: $junitPath"
          }

          [xml]$junit = Get-Content $junitPath

          $suites = $junit.SelectNodes("//testsuite")

          $tests = 0
          $failures = 0
          $errors = 0
          $skipped = 0

          foreach ($suite in $suites) {
            $tests += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
            $skipped += [int]$suite.skipped
          }

          Write-Host "Testes encontrados: $tests"
          Write-Host "Falhas: $failures"
          Write-Host "Erros: $errors"
          Write-Host "Ignorados: $skipped"

          if ($tests -ne 10 -or $failures -ne 0 -or $errors -ne 0 -or $skipped -ne 0) {
            throw "A suíte de aceitação não atingiu o resultado esperado: 10 PASS, 0 FAIL e 0 SKIP."
          }

          Write-Host "Todos os 10 testes de aceitação passaram."

      - name: Publicar evidências dos testes de aceitação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-reports
          path: acceptance-tests/reports/
          if-no-files-found: warn
          retention-days: 14
